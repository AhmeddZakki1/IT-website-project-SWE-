<!DOCTYPE html>
<html lang = "en">
<head> 
<meta charset = "UTF-8">
<title>Models | SWE Motors</title>
<style>
    * { margin: 0px; padding: 0px; box-sizing: border-box; }
    body { 
      font-family:Arial, sans-serif; 
      background:#495057; 
      color: #222;
    }
	h1 {font-size: 40px ; text-align: center; padding-left : 80px ; padding-right : 80px ;  padding-top : 30px ;
	color : #bfc0c0 ; background-color : #000000 ;}
	.country-menu {display : flex ; gap : 50px ; font-size : 40px ; padding-left : 300px ; position : absolute ; padding-top : 40px }
	.country-menu a{color : i80erit ; cursor : point8 ; text-decoration : none ;
	text-align : center ; border : solid 2px  ; padding: 10px ; }
    .home-a {margin-bottom : 800px ; color : inherit ; position : absolute ;
	top : 20px ; font-size : 20px ; border : solid 10px ; border-radius : 0px ; text-decoration: none ; }

    .countries-grid {
      max-width: 1100px;
      margin: 60px auto;
      padding: 0 5%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(640px, 1fr));
      gap: 45px;
	  
    }
    .country-card {
      background:#222;
      border : solid ;
	  border-radius: 120px;
      padding: 35px 20px;
      text-align: center;
      text-decoration: none;
      color : #fff;
      box-shadow: 0 4px 12px rgba(0,0,0.08);
      transition: 0.3s;
	  font-size : 50px ;
    }
    .country-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
	  background : linear-gradient(45deg,#2e3192,#1bffff);
    }
    .country-card .flag { font-size: 60px; margin-bottom: 15px; }
    .country-card h2 { font-size: 24px; margin-bottom: 8px; }
    .country-card p { color: #64748b; font-size: 14px; }
	

</style>

</head>
<body> 
<div>
<h1>
SWE Motors
<p style = "font-size : 15px ; padding-top : 50px " >Choose the cars by the country of manufacture</p>
<br>
</h1>
<main class = "countries-grid">

<a href = "korean.html" class = "country-card">South Korea</a>
<a href = "USA.html" class = "country-card">USA</a>
<a href = "japanese.html" class = "country-card">Japan</a>
<a href = "french.html" class = "country-card">France</a>

</main>


</body>

</html>
