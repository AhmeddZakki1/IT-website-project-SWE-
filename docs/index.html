	<script>
const nav = document.querySelector('nav');
const links = nav.querySelectorAll('a');
const indicator = nav.querySelector('span');

function moveIndicator(element) {
  indicator.style.left = element.offsetLeft + 'px';
  indicator.style.width = element.offsetWidth + 'px';
}

moveIndicator(links[0]);

links.forEach(link => {
  link.addEventListener('mouseenter', (e) => {
    moveIndicator(e.target);

    // 1. hat el ID bta3 el soot mn data-sound
    const soundId = e.target.dataset.sound;
    const sound = document.getElementById(soundId);

    if (sound) {
      // 2. wa2af ay soot tany shaghal 3shan my7salsh laghbata
      document.querySelectorAll('audio').forEach(a => {
        a.pause();
        a.currentTime = 0;
      });

      // 3. sha8al el soot da
      sound.volume = 0.25;
      sound.currentTime = 0;
      sound.play().catch(err => {});
    }
  });
});

nav.addEventListener('mouseleave', () => moveIndicator(links[0]));
</script>
